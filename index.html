<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سعرها - بالسعر الأصلي</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="سعرها">
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fdfdfd;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* شريط التثبيت العلوي */
        #app-install-banner {
            width: 100%;
            background-color: #f97316;
            color: #ffffff;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 9999;
        }
        .banner-text { display: flex; align-items: center; gap: 8px; }
        .btn-close { background: transparent; border: none; color: #fff; font-size: 16px; cursor: pointer; opacity: 0.8; }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            padding-bottom: 130px;
        }

        /* اللوقو المستوحى من هوية التطبيق */
        .app-logo-badge {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            border-radius: 28px;
            box-shadow: 0 12px 25px rgba(249, 115, 22, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            border: 2px solid #fff;
        }
        .app-logo-badge .tag-icon { font-size: 32px; margin-bottom: 2px; }
        .app-logo-badge .logo-text { font-size: 16px; font-weight: 900; letter-spacing: -0.5px; }

        h1 { color: #f97316; font-size: 26px; margin: 12px 0 4px; }
        p.slogan { color: #666; font-size: 14px; font-weight: bold; margin-bottom: 20px; }

        .store-title {
            width: 100%;
            text-align: right;
            font-size: 16px;
            font-weight: bold;
            color: #f97316;
            margin: 15px 0 10px;
            border-bottom: 2px solid #fff0e6;
            padding-bottom: 5px;
        }

        .product-card {
            background: #ffffff;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f0f0f0;
            margin-bottom: 10px;
        }
        .product-info { text-align: right; }
        .product-name { font-weight: bold; font-size: 15px; color: #333; }
        .product-price { color: #f97316; font-size: 13px; font-weight: bold; margin-top: 4px; }
        
        .add-btn {
            background-color: #f97316;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        /* خيارات الاستلام / التوصيل والموقع */
        .order-options-box {
            width: 100%;
            background: #fff;
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            margin-top: 15px;
            text-align: right;
            border: 1px solid #eee;
        }
        .order-options-box label {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            display: block;
            margin-bottom: 6px;
        }
        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .type-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid #eee;
            background: #fdfdfd;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #666;
            text-align: center;
        }
        .type-btn.active {
            border-color: #f97316;
            background: #fff7ed;
            color: #f97316;
        }
        .location-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            text-align: right;
        }
        .location-input:focus {
            border-color: #f97316;
        }

        /* شريط السلة والسفلي */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 100;
        }
        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div id="app-install-banner">
        <div class="banner-text">
            <span>📲 لتثبيت التطبيق: اضغط <b>مشاركة</b> ثم <b>إضافة للشاشة الرئيسية</b></span>
        </div>
        <button class="btn-close" onclick="document.getElementById('app-install-banner').style.display='none'">✕</button>
    </div>

    <div class="main-content">
        <!-- اللوقو -->
        <div class="app-logo-badge">
            <div class="tag-icon">🏷️</div>
            <div class="logo-text">سعرها</div>
        </div>

        <h1>سعرها</h1>
        <p class="slogan">بالسعر الأصلي</p>

        <!-- قائمة المنتجات (من الشيت) -->
        <div id="products-container" style="width: 100%;">
            <div style="color: #666; font-size: 14px; text-align: center; padding: 20px;">جاري تحميل القائمة من قوقل شيت...</div>
        </div>

        <!-- خيارات طريقة الاستلام والموقع -->
        <div class="order-options-box">
            <label>طريقة الاستلام:</label>
            <div class="type-selector">
                <button type="button" class="type-btn active" id="btn-pickup" onclick="setOrderType('استلام من المتجر')">🛍️ استلام من المتجر</button>
                <button type="button" class="type-btn" id="btn-delivery" onclick="setOrderType('توصيل')">🚗 توصيل</button>
            </div>
            
            <div id="location-wrapper" style="display: none;">
                <label>عنوان / موقع التوصيل:</label>
                <input type="text" id="user-location" class="location-input" placeholder="اكتبي الحي أو الشارع أو أرفقي رابط موقعك هنا...">
            </div>
        </div>
    </div>

    <!-- شريط السلة السفلي -->
    <div class="cart-bar">
        <div>
            <span style="font-size: 12px; color: #666;">العناصر: <b id="cart-count">0</b></span><br>
            <span style="font-size: 15px; font-weight: bold; color: #f97316;" id="cart-total">0 ر.س</span>
        </div>
        <button class="whatsapp-btn" onclick="sendToWhatsApp()">
            إرسال الطلب للواتساب 💬
        </button>
    </div>

    <script>
        const SHEET_ID = '1qn2wHi6dkz_-YqU4r_1fHfz97oYwWWHL0d2mEliuCSo';
        const SHEET_URL = `https://opensheet.elk.sh/${SHEET_ID}/1`;

        let cart = [];
        let storeNumber = "966502400234";
        let orderType = "استلام من المتجر";

        async function loadSheetData() {
            try {
                const response = await fetch(SHEET_URL);
                const rows = await response.json();
                
                const container = document.getElementById('products-container');
                container.innerHTML = '';

                const items = [
                    { name: "كرواسون", price: 12 },
                    { name: "قهوة", price: 6 },
                    { name: "ماكرون", price: 6 }
                ];

                let html = `<div class="store-title">🏪 مخابز زين</div>`;
                items.forEach(item => {
                    html += `
                        <div class="product-card">
                            <div class="product-info">
                                <div class="product-name">${item.name}</div>
                                <div class="product-price">${item.price} ر.س</div>
                            </div>
                            <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">إضافة</button>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (error) {
                console.error(error);
                document.getElementById('products-container').innerHTML = '<div style="color:red; text-align:center;">تعذر جلب البيانات من الشيت</div>';
            }
        }

        function setOrderType(type) {
            orderType = type;
            const btnPickup = document.getElementById('btn-pickup');
            const btnDelivery = document.getElementById('btn-delivery');
            const locationWrapper = document.getElementById('location-wrapper');

            if (type === 'استلام من المتجر') {
                btnPickup.classList.add('active');
                btnDelivery.classList.remove('active');
                locationWrapper.style.display = 'none';
            } else {
                btnDelivery.classList.add('active');
                btnPickup.classList.remove('active');
                locationWrapper.style.display = 'block';
            }
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = total + ' ر.س';
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert('الرجاء اختيار وجبة واحدة على الأقل قبل الإرسال!');
                return;
            }

            let locationText = document.getElementById('user-location').value.trim();
            if (orderType === 'توصيل' && !locationText) {
                alert('الرجاء كتابة موقع أو عنوان التوصيل قبل إرسال الطلب!');
                return;
            }

            let message = `أهلاً، أبي أطلب عن طريق سعرها:\n\n`;
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} - ${item.price} ر.س\n`;
            });
            
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            message += `\nالمجموع الكلي: ${total} ر.س`;
            message += `\n\n📍 طريقة الاستلام: ${orderType}`;
            
            if (orderType === 'توصيل') {
                message += `\n🏠 موقع/عنوان التوصيل: ${locationText}`;
            }

            let url = `https://wa.me/${storeNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        loadSheetData();

        window.addEventListener('DOMContentLoaded', () => {
            const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
            if (isStandalone) {
                const banner = document.getElementById('app-install-banner');
                if (banner) banner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
