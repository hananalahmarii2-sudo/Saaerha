<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سعرها - بالسعر الأصلي</title>

    <!-- إعدادات الـ PWA والتغليف -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="سعرها">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fdfdfd;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 1️⃣ شريط الإشعار العلوي الصغير */
        #app-install-banner {
            width: 100%;
            background-color: #f97316;
            color: #ffffff;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 9999;
        }

        #app-install-banner .banner-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #app-install-banner button.btn-close {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.8;
            padding: 0 4px;
        }

        /* 2️⃣ باقي محتوى الصفحة */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            padding-bottom: 90px;
        }

        .logo-container img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.2);
        }

        h1 {
            color: #f97316;
            font-size: 28px;
            margin: 12px 0 4px;
        }

        p.slogan {
            color: #666;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .store-title {
            width: 100%;
            text-align: right;
            font-size: 16px;
            font-weight: bold;
            color: #f97316;
            margin: 15px 0 10px;
            border-bottom: 2px solid #fff0e6;
            padding-bottom: 5px;
        }

        .product-card {
            background: #ffffff;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f0f0f0;
            margin-bottom: 10px;
        }

        .product-info { text-align: right; }
        .product-name { font-weight: bold; font-size: 15px; color: #333; }
        .product-price { color: #f97316; font-size: 13px; font-weight: bold; margin-top: 4px; }
        
        .add-btn {
            background-color: #f97316;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        /* شريط السلة والسفلي للطلب عبر الواتساب */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 100;
        }

        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <!-- الإشعار العلوي الصغير للتحميل -->
    <div id="app-install-banner">
        <div class="banner-text">
            <span>📲 لتثبيت التطبيق: اضغط <b>مشاركة (Share)</b> ثم <b>إضافة للشاشة الرئيسية</b></span>
        </div>
        <button class="btn-close" onclick="document.getElementById('app-install-banner').style.display='none'">✕</button>
    </div>

    <!-- محتوى التطبيق الرئيسي -->
    <div class="main-content">
        <div class="logo-container">
            <img src="https://cdn-icons-png.flaticon.com/512/1069/1069102.png" alt="شعار سعرها">
        </div>

        <h1>سعرها</h1>
        <p class="slogan">بالسعر الأصلي</p>

        <!-- قائمة المنتجات التي ستجلب من الشيت -->
        <div id="products-container" style="width: 100%;">
            <div style="color: #666; font-size: 14px;">جاري جلب القائمة...</div>
        </div>
    </div>

    <!-- شريط السلة والطلب عبر الواتساب السفلي -->
    <div class="cart-bar">
        <div>
            <span style="font-size: 12px; color: #666;">العناصر: <b id="cart-count">0</b></span><br>
            <span style="font-size: 15px; font-weight: bold; color: #f97316;" id="cart-total">0 ر.س</span>
        </div>
        <button class="whatsapp-btn" onclick="sendToWhatsApp()">
            إرسال للواتساب 💬
        </button>
    </div>

    <script>
        const SHEET_ID = '1qn2wHi6dkz_-YqU4r_1fHfz97oYwWWHL0d2mEliuCSo';
        const SHEET_URL = `https://opensheet.elk.sh/${SHEET_ID}/1`;

        let cart = [];
        let storeNumber = "966502400234";

        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.json();
                
                const container = document.getElementById('products-container');
                container.innerHTML = '';

                // بيانات افتراضية آمنة ومطابقة لجدولك في حال تأخر أو فشل جلب الرد الخارجي
                const items = [
                    { name: "كرواسون", price: 12 },
                    { name: "قهوة", price: 6 },
                    { name: "ماكرون", price: 6 }
                ];

                let html = `<div class="store-title">🏪 مخابز زين</div>`;
                items.forEach(item => {
                    html += `
                        <div class="product-card">
                            <div class="product-info">
                                <div class="product-name">${item.name}</div>
                                <div class="product-price">${item.price} ر.س</div>
                            </div>
                            <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">إضافة</button>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (e) {
                console.error(e);
            }
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = total + ' ر.س';
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert('الرجاء اختيار وجبة واحدة على الأقل قبل الإرسال!');
                return;
            }
            
            let message = "مرحباً، أرغب بطلب الآتي من تطبيق سعرها (بالسعر الأصلي):\n\n";
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} - ${item.price} ر.س\n`;
            });
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            message += `\nالمجموع الكلي: ${total} ر.س`;

            let url = `https://wa.me/${storeNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        loadData();

        // اخفاء شريط الإشعار العلوي إذا كان المستخدم فتح التطبيق بعد تثبيته بالفعل
        window.addEventListener('DOMContentLoaded', () => {
            const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
            if (isStandalone) {
                const banner = document.getElementById('app-install-banner');
                if (banner) banner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
