<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سعرها - بالسعر الأصلي</title>

    <!-- إعدادات الـ PWA والتغليف -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="سعرها">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fdfdfd;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        /* 1️⃣ شريط الإشعار العلوي الصغير */
        #app-install-banner {
            width: 100%;
            background-color: #f97316;
            color: #ffffff;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 9999;
        }

        #app-install-banner .banner-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #app-install-banner button.btn-close {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.8;
            padding: 0 4px;
        }

        /* 2️⃣ باقي محتوى الصفحة */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        .logo-container img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.2);
        }

        h1 {
            color: #f97316;
            font-size: 28px;
            margin: 12px 0 4px;
        }

        p.slogan {
            color: #666;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .content-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 90%;
            width: 380px;
            border: 1px solid #f0f0f0;
        }
    </style>
</head>
<body>

    <!-- الإشعار العلوي الصغير للتحميل -->
    <div id="app-install-banner">
        <div class="banner-text">
            <span>📲 لتثبيت التطبيق: اضغط <b>مشاركة (Share)</b> ثم <b>إضافة للشاشة الرئيسية</b></span>
        </div>
        <button class="btn-close" onclick="document.getElementById('app-install-banner').style.display='none'">✕</button>
    </div>

    <!-- محتوى التطبيق الرئيسي -->
    <div class="main-content">
        <div class="logo-container">
            <img src="https://cdn-icons-png.flaticon.com/512/1069/1069102.png" alt="شعار سعرها">
        </div>

        <h1>سعرها</h1>
        <p class="slogan">بالسعر الأصلي</p>

        <div class="content-box">
            <p>مرحباً بكِ في تطبيق <strong>سعرها</strong> لمقارنة الأسعار والطلب بالسعر الأصلي!</p>
        </div>
    </div>

    <script>
      // اخفاء شريط الإشعار العلوي إذا كان المستخدم فتح التطبيق بعد تثبيته بالفعل
      window.addEventListener('DOMContentLoaded', () => {
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        if (isStandalone) {
          const banner = document.getElementById('app-install-banner');
          if (banner) banner.style.display = 'none';
        }
      });
    </script>
</body>
</html>
